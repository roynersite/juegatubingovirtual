<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Interactivo Pro - Ultra Edition</title>
    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --accent: #f59e0b;
            
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-sidebar: #ffffff;
            --bg-input: #f1f5f9;
            
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            
            --chip-bg: #fef3c7;
            --chip-border: #f59e0b;
            --chip-text: #78350f;

            --hit-bg: #dcfce7;
            --hit-border: #22c55e;
            --hit-text: #166534;
            
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 20px -2px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.12);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* TEMAS VISUALES */
        body.theme-rosa { --primary: #ec4899; --primary-dark: #be185d; --primary-light: #fdf2f8; }
        body.theme-rojo { --primary: #ef4444; --primary-dark: #b91c1c; --primary-light: #fef2f2; }
        body.theme-verde { --primary: #10b981; --primary-dark: #047857; --primary-light: #ecfdf5; }
        body.theme-morado { --primary: #8b5cf6; --primary-dark: #6d28d9; --primary-light: #f5f3ff; }
        body.theme-naranja { --primary: #f97316; --primary-dark: #c2410c; --primary-light: #fff7ed; }
        body.theme-negro { --primary: #334155; --primary-dark: #0f172a; --primary-light: #f8fafc; }

        body.dark-mode {
            --bg-main: #0b0f17;
            --bg-card: #182232;
            --bg-sidebar: #111827;
            --bg-input: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --chip-bg: #451a03;
            --chip-border: #b45309;
            --chip-text: #fef3c7;
            --hit-bg: #064e3b;
            --hit-border: #10b981;
            --hit-text: #d1fae5;
            --primary-light: rgba(59, 130, 246, 0.15);
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 34, 254, 0.1); border-radius: 4px; }

        * { box-sizing: border-box; transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .layout-container { display: flex; width: 100vw; min-height: 100vh; }

        /* SIDEBAR MODERNO */
        .sidebar {
            width: 340px;
            min-width: 340px;
            background: var(--bg-sidebar);
            padding: 24px;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 100;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            border-right: 1px solid var(--border-color);
        }

        .sidebar-header { display: flex; justify-content: space-between; align-items: center; }
        .brand-title { display: flex; align-items: center; gap: 10px; font-size: 1.25em; font-weight: 800; color: var(--primary); }

        .btn-icon {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            width: 38px; height: 38px;
            color: var(--text-main);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: var(--transition);
        }
        .btn-icon:hover { background: var(--primary-light); color: var(--primary); transform: translateY(-2px); }
        .btn-icon.active { background: var(--primary); color: white; }

        /* COLOR PICKER */
        .color-picker-container {
            display: flex; gap: 8px; justify-content: space-between;
            background: var(--bg-input); padding: 8px; border-radius: var(--radius-sm);
        }
        .color-option {
            width: 22px; height: 22px; border-radius: 50%;
            cursor: pointer; transition: var(--transition); border: 2px solid transparent;
        }
        .color-option:hover, .color-option.active { transform: scale(1.2); border-color: var(--text-main); }

        /* CONTROLES E INPUTS */
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label {
            font-weight: 600; font-size: 0.8em; text-transform: uppercase;
            letter-spacing: 0.5px; color: var(--text-muted); display: flex; align-items: center; gap: 6px;
        }
        .input-group input, .input-group select {
            padding: 10px 12px; font-size: 0.95em;
            border: 1px solid var(--border-color); background-color: var(--bg-input);
            color: var(--text-main); border-radius: var(--radius-sm); outline: none;
            font-weight: 600; width: 100%; font-family: inherit;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light);
        }

        .number-input-box {
            font-size: 1.4em !important; text-align: center;
            letter-spacing: 2px; font-weight: 800 !important; color: var(--primary) !important;
        }

        /* BANNER ÚLTIMO NÚMERO */
        .last-number-display {
            background: var(--primary-light); border: 1px solid var(--primary);
            border-radius: var(--radius-sm); padding: 8px 12px;
            display: flex; justify-content: space-between; align-items: center;
            font-weight: 800; font-size: 1.1em; color: var(--primary);
        }

        /* BOTONES */
        .btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px; font-size: 0.9em; font-weight: 700; border-radius: var(--radius-sm);
            border: none; cursor: pointer; transition: var(--transition); width: 100%; font-family: inherit;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
        .btn-secondary { background: #3b82f6; color: white; }
        .btn-secondary:hover { opacity: 0.9; }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
        .btn-outline:hover { background: var(--bg-input); }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }

        /* SECCIÓN ANOTADOS EN 5 COLUMNAS */
        .history-section {
            border-top: 1px solid var(--border-color); padding-top: 12px;
            display: flex; flex-direction: column; gap: 8px; flex: 1;
        }
        .history-title { font-weight: 700; font-size: 0.85em; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
        .history-count { background-color: var(--primary-light); color: var(--primary); padding: 2px 8px; border-radius: 12px; font-size: 0.85em; }

        .bingo-board-container {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
            background: var(--bg-input); padding: 6px; border-radius: var(--radius-sm);
            border: 1px solid var(--border-color); max-height: 230px; overflow-y: auto; align-items: start;
        }
        .bingo-col { display: flex; flex-direction: column; gap: 3px; }
        .bingo-col-header { background-color: var(--primary); color: white; text-align: center; font-weight: 800; font-size: 0.8em; padding: 4px 0; border-radius: 4px; }
        .bingo-col-cells { display: flex; flex-direction: column; gap: 3px; }
        .history-number-chip {
            background-color: var(--chip-bg); border: 1px solid var(--chip-border);
            color: var(--chip-text); text-align: center; font-weight: 700; font-size: 0.75em;
            padding: 4px 0; border-radius: 4px; cursor: pointer; transition: var(--transition);
        }
        .history-number-chip:hover { transform: scale(1.05); }

        /* MAIN CONTENT & CARTONES */
        .main-content { flex: 1; padding: 32px; overflow-x: auto; scroll-behavior: smooth; }
        .sheets-container { display: flex; flex-direction: row; gap: 32px; align-items: flex-start; width: max-content; }
        .sheet {
            background-color: var(--bg-card); padding: 24px; border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md); position: relative; border: 1px solid var(--border-color);
        }
        .sheet-title {
            position: absolute; top: -16px; left: 24px; background: var(--primary); color: white;
            padding: 4px 16px; font-size: 0.85em; font-weight: 800; border-radius: 20px;
            box-shadow: var(--shadow-sm); text-transform: uppercase; letter-spacing: 1px;
        }

        .cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px; }
        .card {
            border: 2px solid var(--border-color); border-radius: var(--radius-md);
            overflow: hidden; background-color: var(--bg-card); width: 220px;
            position: relative; transition: var(--transition); box-shadow: var(--shadow-sm);
        }
        .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
        .card.winning-card {
            border-color: var(--accent) !important;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.4);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        .card-header {
            background-color: var(--primary); color: white;
            display: grid; grid-template-columns: repeat(5, 1fr);
            text-align: center; font-weight: 800; font-size: 1.1em; padding: 6px 0; letter-spacing: 1px;
        }
        .card-grid { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); gap: 1px; background-color: var(--border-color); }
        
        .cell {
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            background-color: var(--bg-card); font-size: 1.1em; font-weight: 700;
            cursor: pointer; user-select: none; color: var(--text-main); transition: var(--transition);
        }
        .cell:hover { background-color: var(--primary-light); }
        .cell.pattern-target:not(.marked) {
            background-color: var(--primary-light) !important; color: var(--primary);
            font-weight: 800; box-shadow: inset 0 0 0 2px var(--primary);
        }
        .cell.marked {
            background-color: var(--chip-bg) !important; color: var(--chip-text) !important;
            box-shadow: inset 0 0 0 2px var(--chip-border); animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .cell.pattern-target.marked {
            background-color: var(--hit-bg) !important; color: var(--hit-text) !important;
            box-shadow: inset 0 0 0 2px var(--hit-border);
        }
        @keyframes pop { 0% { transform: scale(0.8); } 100% { transform: scale(1); } }

        .free-space { font-size: 0.75em; color: var(--primary); font-weight: 800; }
        .card-footer { background-color: var(--bg-input); color: var(--text-muted); text-align: center; font-size: 0.65em; padding: 4px 0; font-weight: 600; }
        .card-progress { background-color: var(--bg-card); color: var(--text-muted); text-align: center; font-size: 0.75em; font-weight: 700; padding: 6px 0; border-top: 1px solid var(--border-color); }

        /* OVERLAYS & MODALES */
        .bingo-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(245, 158, 11, 0.95); color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 2em; font-weight: 900; z-index: 20; animation: pop 0.3s ease;
        }

        .fullscreen-bingo-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(15, 23, 42, 0.9); color: var(--accent);
            display: flex; align-items: center; justify-content: center;
            font-size: 5em; font-weight: 900; z-index: 9999;
            pointer-events: none; opacity: 0; transition: opacity 0.3s ease; backdrop-filter: blur(8px);
        }
        .fullscreen-bingo-overlay.active { opacity: 1; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: var(--transition);
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal-body {
            background: var(--bg-card); color: var(--text-main); padding: 24px;
            border-radius: var(--radius-lg); max-width: 95vw; max-height: 90vh;
            overflow-y: auto; display: flex; flex-direction: column; gap: 20px;
            box-shadow: var(--shadow-lg); border: 1px solid var(--border-color);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
        .modal-header h2 { margin: 0; font-size: 1.2em; display: flex; align-items: center; gap: 8px; }

        .modal-sheets-wrapper { display: flex; flex-direction: row; gap: 16px; overflow-x: auto; padding-bottom: 10px; max-width: 100%; }
        .sheet-fill-block {
            width: 340px; min-width: 340px; border: 1px solid var(--border-color);
            border-radius: var(--radius-md); padding: 12px; background: var(--bg-main);
            flex-shrink: 0; display: flex; flex-direction: column; gap: 8px;
        }
        .sheet-fill-header { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); }
        .sheet-actions-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }

        .fill-grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .fill-card { border: 1px solid var(--border-color); padding: 6px; border-radius: var(--radius-sm); background: var(--bg-card); display: flex; flex-direction: column; gap: 4px; }
        .fill-card-title { font-size: 0.7em; font-weight: 800; color: var(--primary); text-transform: uppercase; text-align: center; letter-spacing: 0.5px; }

        .fill-matrix { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
        .fill-matrix input {
            width: 100%; aspect-ratio: 1; text-align: center; font-size: 0.75em; font-weight: 700;
            border: 1px solid var(--border-color); background-color: var(--bg-input);
            color: var(--text-main); border-radius: 4px; padding: 0; outline: none; -moz-appearance: textfield;
        }
        .fill-matrix input::-webkit-outer-spin-button, .fill-matrix input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .fill-matrix input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-light); background-color: var(--bg-card); }

        /* Estilos de Error para Validación de Duplicados o Rangos */
        .fill-matrix input.input-invalid {
            border-color: #ef4444 !important;
            background-color: #fef2f2 !important;
            color: #b91c1c !important;
            outline: 2px solid #ef4444;
        }
        body.dark-mode .fill-matrix input.input-invalid {
            background-color: #450a0a !important;
            color: #fca5a5 !important;
        }

        .pattern-grid-creator { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; width: 150px; margin: 0 auto; }
        .pattern-grid-cell { aspect-ratio: 1; border: 1px solid var(--border-color); background-color: var(--bg-input); cursor: pointer; border-radius: 4px; }
        .pattern-grid-cell.selected { background-color: var(--primary); }

        .pattern-item-box { border: 1px solid var(--border-color); padding: 12px; border-radius: var(--radius-sm); margin-bottom: 10px; display: flex; gap: 15px; align-items: center; background: var(--bg-main); }

        /* MENÚ CONTEXTUAL PERSONALIZADO */
        .custom-context-menu {
            position: fixed; background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: var(--radius-sm); box-shadow: var(--shadow-md); padding: 4px;
            z-index: 99999; display: none; flex-direction: column; gap: 2px; min-width: 150px;
        }
        .context-menu-item {
            padding: 8px 12px; font-size: 0.85em; font-weight: 600; color: var(--text-main);
            background: transparent; border: none; text-align: left; cursor: pointer;
            border-radius: 4px; display: flex; align-items: center; gap: 8px;
        }
        .context-menu-item:hover { background: var(--primary-light); color: var(--primary); }
        .context-menu-item.danger:hover { background: #fee2e2; color: #ef4444; }

        @media (max-width: 900px) {
            .layout-container { flex-direction: column; }
            .sidebar { width: 100%; min-width: 100%; height: auto; position: relative; }
            .sheets-container { flex-direction: column; width: 100%; }
            .cards-grid { grid-template-columns: 1fr; }
            .main-content { padding: 16px; }
            .fullscreen-bingo-overlay { font-size: 3em; }
        }
    </style>
</head>
<body class="theme-azul">

    <div class="fullscreen-bingo-overlay" id="fullscreenBingo">¡BINGO!</div>

    <!-- Menú Contextual para Grupo Modalidad -->
    <div class="custom-context-menu" id="groupContextMenu">
        <button class="context-menu-item" onclick="editSelectedGroup()"><i data-lucide="edit-2" size="14"></i> Editar Grupo</button>
        <button class="context-menu-item" onclick="duplicateSelectedGroup()"><i data-lucide="copy" size="14"></i> Duplicar Grupo</button>
        <button class="context-menu-item danger" onclick="deleteSelectedGroup()"><i data-lucide="trash-2" size="14"></i> Eliminar Grupo</button>
    </div>

    <div class="layout-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand-title">
                    <i data-lucide="dices"></i>
                    <span>Bingo App</span>
                </div>
                <div style="display: flex; gap: 6px;">
                    <button class="btn-icon" id="speechBtn" onclick="toggleSpeech()" title="Cantar números con voz">
                        <i data-lucide="volume-x"></i>
                    </button>
                    <button class="btn-icon" id="themeBtn" onclick="toggleTheme()" title="Modo Oscuro/Claro">
                        <i data-lucide="moon"></i>
                    </button>
                </div>
            </div>

            <!-- Temas Visuales -->
            <div class="input-group">
                <label><i data-lucide="palette" size="14"></i> Tema Visual</label>
                <div class="color-picker-container">
                    <div class="color-option active" style="background:#3b82f6;" onclick="setThemeClass('theme-azul')" title="Azul"></div>
                    <div class="color-option" style="background:#ef4444;" onclick="setThemeClass('theme-rojo')" title="Rojo"></div>
                    <div class="color-option" style="background:#10b981;" onclick="setThemeClass('theme-verde')" title="Verde"></div>
                    <div class="color-option" style="background:#8b5cf6;" onclick="setThemeClass('theme-morado')" title="Morado"></div>
                    <div class="color-option" style="background:#ec4899;" onclick="setThemeClass('theme-rosa')" title="Rosa"></div>
                    <div class="color-option" style="background:#f97316;" onclick="setThemeClass('theme-naranja')" title="Naranja"></div>
                    <div class="color-option" style="background:#0f172a;" onclick="setThemeClass('theme-negro')" title="Negro"></div>
                </div>
            </div>

            <!-- Guardar / Cargar / Exportar -->
            <div class="input-group" style="background: var(--bg-input); padding: 12px; border-radius: var(--radius-sm);">
                <label><i data-lucide="save" size="14"></i> Guardados</label>
                <button class="btn btn-outline" style="margin-bottom: 6px;" onclick="saveCurrentSlot()">
                    <i data-lucide="download"></i> Guardar Partida
                </button>
                <select id="savedSlotsSelect"></select>
                <div style="display: flex; gap: 6px; margin-top: 6px;">
                    <button class="btn btn-outline" style="flex:1;" onclick="loadSelectedSlot()"><i data-lucide="folder-open"></i> Cargar</button>
                    <button class="btn btn-danger" style="width: 40px;" onclick="deleteSelectedSlot()"><i data-lucide="trash-2"></i></button>
                </div>
                <div style="display: flex; gap: 6px; margin-top: 6px;">
                    <button class="btn btn-outline" style="font-size: 0.75em; padding: 6px;" onclick="exportGameData()" title="Exportar archivo JSON">
                        <i data-lucide="file-output" size="14"></i> Exportar
                    </button>
                    <button class="btn btn-outline" style="font-size: 0.75em; padding: 6px;" onclick="document.getElementById('importFileInput').click()" title="Importar archivo JSON">
                        <i data-lucide="file-input" size="14"></i> Importar
                    </button>
                    <input type="file" id="importFileInput" accept=".json" style="display: none;" onchange="importGameData(this)">
                </div>
            </div>

            <!-- AREA 1: GRUPO MODALIDAD -->
            <div class="input-group">
                <label for="versionSelect"><i data-lucide="layers" size="14"></i> Grupo Modalidad (Clic derecho)</label>
                <select id="versionSelect" onchange="changeVersionGroup()"></select>
                <button class="btn btn-outline" style="margin-top: 4px; font-size:0.8em;" onclick="openGroupModal()">
                    <i data-lucide="plus"></i> Nuevo Grupo
                </button>
            </div>

            <!-- AREA 2: MODALIDAD JUEGO -->
            <div class="input-group">
                <label for="modeSelect"><i data-lucide="grid" size="14"></i> Modalidad Juego</label>
                <select id="modeSelect" onchange="updatePatterns()"></select>
            </div>

            <!-- Entrada de Número -->
            <div class="input-group">
                <label for="numberInput"><i data-lucide="hash" size="14"></i> Cantar Número</label>
                <input type="number" id="numberInput" class="number-input-box" min="1" max="75" placeholder="00">
            </div>

            <div class="action-buttons" style="display: flex; flex-direction: column; gap: 8px;">
                <button class="btn btn-primary" onclick="markFromInput()">
                    <i data-lucide="check-circle"></i> Marcar Número
                </button>
                <button class="btn btn-outline" onclick="undoLastNumber()">
                    <i data-lucide="undo-2"></i> Deshacer Último
                </button>
                
                <!-- AREA 3: EDITAR CARTONES -->
                <button class="btn btn-secondary" onclick="openFillModal()">
                    <i data-lucide="edit-3"></i> Editar Cartones
                </button>

                <button class="btn btn-danger" onclick="resetAll()">
                    <i data-lucide="rotate-ccw"></i> Reiniciar
                </button>
            </div>

            <!-- Mostrador de Último Número -->
            <div class="last-number-display">
                <span>Último Cantado:</span>
                <span id="lastNumberValue">--</span>
            </div>

            <!-- Historial en 5 columnas (B-I-N-G-O) -->
            <div class="history-section">
                <div class="history-title">
                    <span>Anotados</span>
                    <span class="history-count" id="historyCount">0</span>
                </div>
                <div class="bingo-board-container" id="bingoBoardContainer"></div>
            </div>
        </aside>

        <main class="main-content">
            <div class="sheets-container" id="sheetsContainer"></div>
        </main>
    </div>

    <!-- MODAL EDITAR CARTONES -->
    <div class="modal-overlay" id="fillModal">
        <div class="modal-body">
            <div class="modal-header">
                <h2><i data-lucide="edit"></i> Editar / Rellenar Cartones</h2>
                <button class="btn-icon" onclick="closeFillModal()"><i data-lucide="x"></i></button>
            </div>
            
            <div class="modal-sheets-wrapper" id="modalSheetsWrapper"></div>

            <div style="display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--border-color); padding-top: 12px; align-items: center; flex-wrap: wrap;">
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-outline" onclick="autoFillRandom()"><i data-lucide="zap"></i> Llenar al Azar</button>
                    <button class="btn btn-outline" onclick="addNewSheet()"><i data-lucide="plus"></i> Nueva Hoja</button>
                </div>
                
                <input type="file" id="sheetTxtFileInput" accept=".txt" style="display: none;" onchange="handleSheetTxtUpload(this)">
                
                <div style="display: flex; gap: 8px; align-items: center;">
                    <button class="btn btn-outline" style="padding: 6px 10px; font-size: 0.78em;" onclick="copyPromptToClipboard()" title="Copiar prompt de lectura para IA">
                        <i data-lucide="copy"></i> Prompt IA Cartones
                    </button>
                    <button class="btn btn-primary" onclick="saveModalChanges()"><i data-lucide="check"></i> Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL CREAR/EDITAR GRUPO MODALIDAD -->
    <div class="modal-overlay" id="groupModal">
        <div class="modal-body" style="max-width: 500px; width: 90%;">
            <div class="modal-header">
                <h2 id="groupModalTitle"><i data-lucide="plus-circle"></i> Crear Grupo Modalidad</h2>
                <button class="btn-icon" onclick="closeGroupModal()"><i data-lucide="x"></i></button>
            </div>
            <div class="input-group">
                <label>Nombre del Grupo</label>
                <input type="text" id="newGroupName" placeholder="Ej: Modalidades Especiales">
            </div>
            <div id="newModesContainer" style="max-height: 350px; overflow-y: auto; padding-right: 4px;"></div>
            <button class="btn btn-outline" onclick="addModeFieldToCreator()"><i data-lucide="plus"></i> Añadir Modalidad al Grupo</button>
            <div style="display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--border-color); padding-top: 12px;">
                <button class="btn btn-outline" onclick="closeGroupModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveNewModalitiesGroup()">Guardar Grupo</button>
            </div>
        </div>
    </div>

    <script>
        const columnRanges = [
            { min: 1, max: 15, name: 'B' },
            { min: 16, max: 30, name: 'I' },
            { min: 31, max: 45, name: 'N' },
            { min: 46, max: 60, name: 'G' },
            { min: 61, max: 75, name: 'O' }
        ];

        let speechEnabled = false;

        function createEmptyCard() {
            const card = Array(25).fill("");
            card[12] = ".es";
            return card;
        }

        function createEmptySheet(id = "") {
            return {
                title: String(id),
                cards: [createEmptyCard(), createEmptyCard(), createEmptyCard(), createEmptyCard()]
            };
        }

        let sheetsData = [createEmptySheet("1"), createEmptySheet("2")];
        let currentUploadSheetIndex = null;

        let allPatterns = {
            v1: {
                groupLabel: "Modalidades Standard (V1)",
                modes: {
                    "1": { label: "1era Modalidad (V1)", indices: [0, 1, 2, 4, 5, 6, 9, 10, 14, 19, 20, 21, 22, 23, 24] },
                    "2": { label: "2da Modalidad (V1)", indices: [0, 1, 2, 3, 5, 9, 10, 11, 12, 13, 15, 18, 20, 24] },
                    "3": { label: "3era Modalidad (V1)", indices: [0, 1, 2, 3, 5, 6, 7, 9, 10, 11, 13, 14, 17, 19, 21, 23, 24] },
                    "4": { label: "Cartón Lleno", indices: Array.from({length: 25}, (_, i) => i) }
                }
            },
            v2: {
                groupLabel: "Modalidades Pro (V2)",
                modes: {
                    "1": { label: "1era Modalidad (V2)", indices: [0, 1, 2, 3, 5, 7, 9, 10, 11, 14, 19, 22, 23, 24] },
                    "2": { label: "2da Modalidad (V2)", indices: [5, 6, 8, 10, 11, 13, 15, 16, 17, 18, 19, 20, 21, 24] },
                    "3": { label: "3era Modalidad (V2)", indices: [1, 2, 3, 8, 10, 11, 13, 14, 16, 17, 18, 19, 21, 22, 23, 24] },
                    "4": { label: "Cartón Lleno", indices: Array.from({length: 25}, (_, i) => i) }
                }
            }
        };

        let markedHistory = [];
        let createdModesCount = 0;
        let editingGroupId = null;

        /* LECTURA POR VOZ */
        function toggleSpeech() {
            speechEnabled = !speechEnabled;
            const btn = document.getElementById('speechBtn');
            if (speechEnabled) {
                btn.classList.add('active');
                btn.innerHTML = '<i data-lucide="volume-2"></i>';
                speakText("Voz activada");
            } else {
                btn.classList.remove('active');
                btn.innerHTML = '<i data-lucide="volume-x"></i>';
                window.speechSynthesis.cancel();
            }
            lucide.createIcons();
        }

        function speakText(text) {
            if (!speechEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES';
            utterance.rate = 0.95;
            window.speechSynthesis.speak(utterance);
        }

        function speakNumber(num) {
            const n = parseInt(num, 10);
            if (isNaN(n)) return;
            let letter = '';
            if (n >= 1 && n <= 15) letter = 'B';
            else if (n >= 16 && n <= 30) letter = 'I';
            else if (n >= 31 && n <= 45) letter = 'N';
            else if (n >= 46 && n <= 60) letter = 'G';
            else if (n >= 61 && n <= 75) letter = 'O';

            speakText(`${letter}, ${n}`);
        }

        /* AREA 3: COPIAR PROMPT DE LECTURA PARA IA */
        function copyPromptToClipboard() {
            const promptText = `Analiza esta imagen de cartones de bingo. Necesito que extraigas los números de cada uno de los 4 cartones visibles y me generes un archivo de texto (.txt) plano con la información.
Instrucciones de formato para el TXT:

El archivo debe contener solo números y espacios.
Cada línea del archivo corresponderá a un cartón completo (leyendo fila por fila, de izquierda a derecha, de arriba a abajo).
Debes listar 24 números por línea (omitiendo el espacio central 'FREE' o '.es', ya que la aplicación lo pone automáticamente).
Los números deben estar separados por un solo espacio.
El orden de las líneas en el TXT debe ser estricto:
Línea 1: Cartón superior izquierdo.
Línea 2: Cartón superior derecho.
Línea 3: Cartón inferior izquierdo.
Línea 4: Cartón inferior derecho.
Dame solo el bloque de código de texto para copiar y pegar directamente en un archivo .txt.`;

            navigator.clipboard.writeText(promptText).then(() => {
                alert("¡Prompt copiado al portapapeles con éxito!");
            }).catch(err => {
                alert("Error al copiar el prompt: " + err);
            });
        }

        function setThemeClass(themeClassName) {
            document.body.className = document.body.className.replace(/\btheme-\S+/g, '');
            document.body.classList.add(themeClassName);
            document.querySelectorAll('.color-option').forEach(el => el.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('themeBtn').innerHTML = isDark ? '<i data-lucide="sun"></i>' : '<i data-lucide="moon"></i>';
            lucide.createIcons();
        }

        /* AREA 1: FUNCIONES DE GRUPO MODALIDAD */
        function refreshVersionSelectOptions() {
            const versionSelect = document.getElementById('versionSelect');
            if(!versionSelect) return;
            const currentVal = versionSelect.value;
            versionSelect.innerHTML = '';

            for (let key in allPatterns) {
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = allPatterns[key].groupLabel || key;
                versionSelect.appendChild(opt);
            }
            versionSelect.value = allPatterns[currentVal] ? currentVal : Object.keys(allPatterns)[0];
        }

        function changeVersionGroup() {
            const version = document.getElementById('versionSelect').value;
            const modeSelect = document.getElementById('modeSelect');
            modeSelect.innerHTML = '';

            if (allPatterns[version] && allPatterns[version].modes) {
                const modes = allPatterns[version].modes;
                for (let key in modes) {
                    const opt = document.createElement('option');
                    opt.value = key;
                    opt.textContent = modes[key].label;
                    modeSelect.appendChild(opt);
                }
            }
            updatePatterns();
        }

        function openGroupModal(editKey = null) {
            editingGroupId = editKey;
            const container = document.getElementById('newModesContainer');
            container.innerHTML = '';
            createdModesCount = 0;

            if (editKey && allPatterns[editKey]) {
                document.getElementById('groupModalTitle').innerHTML = '<i data-lucide="edit"></i> Editar Grupo Modalidad';
                document.getElementById('newGroupName').value = allPatterns[editKey].groupLabel || '';
                
                const modes = allPatterns[editKey].modes;
                for (let mKey in modes) {
                    addModeFieldToCreator(modes[mKey].label, modes[mKey].indices);
                }
            } else {
                document.getElementById('groupModalTitle').innerHTML = '<i data-lucide="plus-circle"></i> Crear Grupo Modalidad';
                document.getElementById('newGroupName').value = '';
                addModeFieldToCreator();
            }

            document.getElementById('groupModal').classList.add('active');
            lucide.createIcons();
        }

        function closeGroupModal() {
            document.getElementById('groupModal').classList.remove('active');
            editingGroupId = null;
        }

        function addModeFieldToCreator(defaultName = '', activeIndices = []) {
            createdModesCount++;
            const container = document.getElementById('newModesContainer');
            const box = document.createElement('div');
            box.className = 'pattern-item-box';

            let gridCells = '';
            for (let i = 0; i < 25; i++) {
                const isSelected = activeIndices.includes(i) ? 'selected' : '';
                gridCells += `<div class="pattern-grid-cell ${isSelected}" data-idx="${i}" onclick="togglePatternCell(this)"></div>`;
            }

            box.innerHTML = `
                <div style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
                    <label style="font-size: 0.8em; font-weight: bold;">Modalidad ${createdModesCount}:</label>
                    <input type="text" class="new-mode-name" value="${defaultName}" placeholder="Ej. Cuatro Esquinas, Cruz..." style="width: 100%;">
                </div>
                <div>
                    <label style="font-size: 0.75em; font-weight: bold; display: block; text-align: center; margin-bottom: 4px;">Patrón:</label>
                    <div class="pattern-grid-creator">
                        ${gridCells}
                    </div>
                </div>
            `;
            container.appendChild(box);
        }

        function togglePatternCell(cellEl) {
            cellEl.classList.toggle('selected');
        }

        function saveNewModalitiesGroup() {
            const groupName = document.getElementById('newGroupName').value.trim();
            if (!groupName) {
                alert("Ingresa un nombre para el grupo de modalidades.");
                return;
            }

            const boxes = document.querySelectorAll('#newModesContainer .pattern-item-box');
            let newModesObj = {};
            let validCount = 0;

            boxes.forEach((box, index) => {
                const nameInput = box.querySelector('.new-mode-name').value.trim();
                const selectedCells = box.querySelectorAll('.pattern-grid-cell.selected');
                
                if (nameInput) {
                    let indices = [];
                    selectedCells.forEach(cell => {
                        indices.push(parseInt(cell.dataset.idx, 10));
                    });

                    newModesObj[String(index + 1)] = {
                        label: nameInput,
                        indices: indices
                    };
                    validCount++;
                }
            });

            if (validCount === 0) {
                alert("Añade al menos una modalidad válida con su patrón.");
                return;
            }

            const targetGroupId = editingGroupId ? editingGroupId : ("custom_" + Date.now());
            allPatterns[targetGroupId] = {
                groupLabel: groupName,
                modes: newModesObj
            };

            refreshVersionSelectOptions();
            document.getElementById('versionSelect').value = targetGroupId;
            changeVersionGroup();
            closeGroupModal();
        }

        /* CLIC DERECHO EN GRUPO MODALIDAD */
        const versionSelectEl = document.getElementById('versionSelect');
        const contextMenuEl = document.getElementById('groupContextMenu');

        if(versionSelectEl) {
            versionSelectEl.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                const groupKey = versionSelectEl.value;
                if (!groupKey) return;

                contextMenuEl.style.top = `${e.clientY}px`;
                contextMenuEl.style.left = `${e.clientX}px`;
                contextMenuEl.style.display = 'flex';
            });
        }

        window.addEventListener('click', () => {
            if(contextMenuEl) contextMenuEl.style.display = 'none';
        });

        function editSelectedGroup() {
            const groupKey = versionSelectEl.value;
            if (!groupKey) return;
            openGroupModal(groupKey);
        }

        /* DUPLICAR GRUPO MODALIDAD */
        function duplicateSelectedGroup() {
            const groupKey = versionSelectEl.value;
            if (!groupKey || !allPatterns[groupKey]) return;

            const newKey = "custom_" + Date.now();
            const originalGroup = allPatterns[groupKey];
            
            allPatterns[newKey] = JSON.parse(JSON.stringify(originalGroup));
            allPatterns[newKey].groupLabel += " (Copia)";

            refreshVersionSelectOptions();
            document.getElementById('versionSelect').value = newKey;
            changeVersionGroup();
        }

        function deleteSelectedGroup() {
            const groupKey = versionSelectEl.value;
            if (!groupKey) return;

            const groupName = allPatterns[groupKey]?.groupLabel || groupKey;
            if (confirm(`¿Eliminar el grupo "${groupName}"?`)) {
                delete allPatterns[groupKey];
                
                if (Object.keys(allPatterns).length === 0) {
                    allPatterns['v1'] = { groupLabel: "Modalidades V1", modes: { "1": { label: "Cartón Lleno", indices: Array.from({length: 25}, (_, i) => i) } } };
                }

                refreshVersionSelectOptions();
                changeVersionGroup();
            }
        }

        function renderGame() {
            const container = document.getElementById('sheetsContainer');
            if(!container) return;
            container.innerHTML = '';

            sheetsData.forEach((sheet) => {
                const sheetDiv = document.createElement('div');
                sheetDiv.className = 'sheet';

                let html = `<div class="sheet-title">${sheet.title || 'HOJA'}</div><div class="cards-grid">`;

                sheet.cards.forEach((cardNumbers) => {
                    html += `<div class="card">
                        <div class="card-header"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
                        <div class="card-grid">`;

                    cardNumbers.forEach((val, idx) => {
                        if (idx === 12 || val === ".es") {
                            html += `<div class="cell free-space marked" data-cell-idx="${idx}" data-val=".es">★</div>`;
                        } else {
                            html += `<div class="cell" data-cell-idx="${idx}" data-val="${val}">${val !== "" ? val : ""}</div>`;
                        }
                    });

                    html += `</div>
                        <div class="card-progress">Progreso: 0 / 0</div>
                        <div class="card-footer">BINGO APP PRO</div>
                    </div>`;
                });

                html += `</div>`;
                sheetDiv.innerHTML = html;
                container.appendChild(sheetDiv);
            });

            document.querySelectorAll('.cell').forEach(cell => {
                cell.addEventListener('click', () => {
                    toggleNumber(cell.getAttribute('data-val'));
                });
            });

            markedHistory.forEach(num => {
                document.querySelectorAll(`.cell[data-val="${num}"]`).forEach(c => c.classList.add('marked'));
            });

            renderHistory();
            updatePatterns();
            lucide.createIcons();
        }

        function toggleNumber(val) {
            if (!val || val === "" || val === ".es") return;

            const matching = document.querySelectorAll(`.cell[data-val="${val}"]`);
            if (matching.length === 0) return;

            const isMarked = matching[0].classList.contains('marked');

            matching.forEach(c => c.classList.toggle('marked', !isMarked));

            if (isMarked) {
                markedHistory = markedHistory.filter(n => String(n) !== String(val));
            } else {
                markedHistory = markedHistory.filter(n => String(n) !== String(val));
                markedHistory.unshift(val);
                speakNumber(val);
            }

            renderHistory();
            updatePatterns();
        }

        function undoLastNumber() {
            if (markedHistory.length === 0) return;
            const lastNum = markedHistory[0];
            toggleNumber(lastNum);
        }

        function renderHistory() {
            const container = document.getElementById('bingoBoardContainer');
            const countEl = document.getElementById('historyCount');
            const lastValEl = document.getElementById('lastNumberValue');

            if(!container || !countEl) return;
            countEl.textContent = markedHistory.length;
            
            if (lastValEl) {
                lastValEl.textContent = markedHistory.length > 0 ? markedHistory[0] : '--';
            }

            container.innerHTML = '';

            columnRanges.forEach(col => {
                const colDiv = document.createElement('div');
                colDiv.className = 'bingo-col';

                const annotatedInCol = markedHistory
                    .map(n => parseInt(n, 10))
                    .filter(n => n >= col.min && n <= col.max)
                    .sort((a, b) => a - b);

                let colHtml = `<div class="bingo-col-header">${col.name}</div><div class="bingo-col-cells">`;

                annotatedInCol.forEach(num => {
                    colHtml += `<div class="history-number-chip" onclick="toggleNumber(${num})">${num}</div>`;
                });

                colHtml += `</div>`;
                colDiv.innerHTML = colHtml;
                container.appendChild(colDiv);
            });
        }

        /* AREA 2: MODALIDAD JUEGO & INDICADORES DE PROGRESO */
        function updatePatterns() {
            const versionSelect = document.getElementById('versionSelect');
            const modeSelect = document.getElementById('modeSelect');
            if(!versionSelect || !modeSelect) return;

            const version = versionSelect.value;
            const mode = modeSelect.value;
            
            const targetIndices = (allPatterns[version] && allPatterns[version].modes && allPatterns[version].modes[mode]) 
                ? allPatterns[version].modes[mode].indices 
                : [];

            document.querySelectorAll('.card').forEach(card => {
                const cells = card.querySelectorAll('.cell');
                let hitCount = 0;

                cells.forEach((cell) => {
                    const cellIdx = parseInt(cell.getAttribute('data-cell-idx'), 10);
                    const isTarget = targetIndices.includes(cellIdx);
                    
                    cell.classList.toggle('pattern-target', isTarget);

                    if (cell.classList.contains('marked') && isTarget) {
                        hitCount++;
                    }
                });

                const progressDiv = card.querySelector('.card-progress');
                if (progressDiv) {
                    const remaining = targetIndices.length - hitCount;
                    progressDiv.textContent = `Faltan: ${remaining} (${hitCount}/${targetIndices.length})`;
                }

                const isComplete = (hitCount === targetIndices.length) && (targetIndices.length > 0);
                const hasOverlay = card.querySelector('.bingo-overlay');

                if (isComplete && !hasOverlay) {
                    card.classList.add('winning-card');
                    const overlay = document.createElement('div');
                    overlay.className = 'bingo-overlay';
                    overlay.innerHTML = '<i data-lucide="trophy" size="48"></i> ¡BINGO!';
                    card.appendChild(overlay);
                    triggerFullscreenBingo(card);
                } else if (!isComplete) {
                    if (hasOverlay) hasOverlay.remove();
                    card.classList.remove('winning-card');
                }
            });
            lucide.createIcons();
        }

        function triggerFullscreenBingo(winningCard) {
            const fsOverlay = document.getElementById('fullscreenBingo');
            if(!fsOverlay) return;
            fsOverlay.classList.add('active');
            confetti({ particleCount: 120, spread: 100, origin: { y: 0.6 } });
            speakText("¡Bingo! ¡Cartón Ganador!");

            if (winningCard) {
                winningCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            setTimeout(() => fsOverlay.classList.remove('active'), 3000);
        }

        function markFromInput() {
            const input = document.getElementById('numberInput');
            if(!input) return;
            const val = input.value.trim();
            if (val !== "") {
                toggleNumber(val);
                input.value = "";
                input.focus();
            }
        }

        const numInputEl = document.getElementById('numberInput');
        if(numInputEl) {
            numInputEl.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') markFromInput();
            });
        }

        function resetAll() {
            document.querySelectorAll('.cell.marked:not(.free-space)').forEach(c => c.classList.remove('marked'));
            document.querySelectorAll('.bingo-overlay').forEach(el => el.remove());
            document.querySelectorAll('.winning-card').forEach(c => c.classList.remove('winning-card'));
            markedHistory = [];
            renderHistory();
            updatePatterns();
        }

        /* AREA 3: MODAL EDITAR CARTONES */
        function openFillModal() { 
            renderModalSheets(); 
            document.getElementById('fillModal').classList.add('active'); 
        }

        function closeFillModal() { 
            document.getElementById('fillModal').classList.remove('active'); 
        }

        function renderModalSheets() {
            const wrapper = document.getElementById('modalSheetsWrapper');
            if(!wrapper) return;
            wrapper.innerHTML = '';

            sheetsData.forEach((sheet, sIdx) => {
                const sheetBlock = document.createElement('div');
                sheetBlock.className = 'sheet-fill-block';

                let htmlHeader = `
                    <div class="sheet-fill-header">
                        <input type="text" id="sheetNum${sIdx}" value="${sheet.title || `Hoja ${sIdx + 1}`}" placeholder="Hoja ${sIdx + 1}" style="font-weight:bold;">
                        <button class="btn btn-danger" style="padding:4px 8px; font-size:0.7em; width:auto;" onclick="removeSheet(${sIdx})" title="Eliminar Hoja"><i data-lucide="trash"></i></button>
                    </div>
                    <div class="sheet-actions-row">
                        <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 0.75em;" onclick="triggerSheetTxtUpload(${sIdx})">
                            <i data-lucide="file-text" size="14"></i> Cargar TXT
                        </button>
                        <button class="btn btn-outline" style="padding: 4px 8px; font-size: 0.75em;" onclick="clearSingleSheet(${sIdx})" title="Vaciar números de la hoja">
                            <i data-lucide="eraser" size="14"></i> Limpiar
                        </button>
                    </div>
                    <div class="fill-grid-container" id="fillContainer${sIdx}"></div>
                `;
                sheetBlock.innerHTML = htmlHeader;
                wrapper.appendChild(sheetBlock);

                const container = document.getElementById(`fillContainer${sIdx}`);

                sheet.cards.forEach((card, cIdx) => {
                    const cardDiv = document.createElement('div');
                    cardDiv.className = 'fill-card';

                    const cardLabel = document.createElement('div');
                    cardLabel.className = 'fill-card-title';
                    cardLabel.textContent = `Cartón ${cIdx + 1}`;
                    cardDiv.appendChild(cardLabel);

                    const matrix = document.createElement('div');
                    matrix.className = 'fill-matrix';

                    card.forEach((val, cellIdx) => {
                        const input = document.createElement('input');
                        input.type = 'number';
                        input.dataset.sheet = sIdx;
                        input.dataset.card = cIdx;
                        input.dataset.cell = cellIdx;

                        if (cellIdx === 12) {
                            input.type = 'text';
                            input.value = '★';
                            input.disabled = true;
                        } else {
                            const colIdx = cellIdx % 5;
                            const range = columnRanges[colIdx];
                            
                            input.dataset.col = colIdx;
                            input.dataset.min = range.min;
                            input.dataset.max = range.max;
                            input.title = `Columna ${range.name} (${range.min}-${range.max})`;

                            input.value = (val !== "" && val !== ".es") ? val : "";

                            input.addEventListener('input', function() {
                                if (this.value.length > 2) {
                                    this.value = this.value.slice(0, 2);
                                }
                                validateCardInput(this);
                            });
                        }
                        matrix.appendChild(input);
                    });

                    cardDiv.appendChild(matrix);
                    container.appendChild(cardDiv);

                    // Ejecutar validación inicial para cada columna del cartón cargado
                    for (let col = 0; col < 5; col++) {
                        const sampleInput = matrix.querySelector(`input[data-col="${col}"]`);
                        if (sampleInput) validateCardInput(sampleInput);
                    }
                });
            });
            lucide.createIcons();
        }

        /* FUNCIÓN DE VALIDACIÓN EN TIEMPO REAL */
        function validateCardInput(inputEl) {
            const sIdx = inputEl.dataset.sheet;
            const cIdx = inputEl.dataset.card;
            const colIdx = inputEl.dataset.col;

            const cardInputs = Array.from(
                document.querySelectorAll(`input[data-sheet="${sIdx}"][data-card="${cIdx}"]`)
            );
            const colInputs = cardInputs.filter(inp => inp.dataset.col === colIdx);

            const valueCounts = {};
            colInputs.forEach(inp => {
                const val = inp.value.trim();
                if (val !== "") {
                    valueCounts[val] = (valueCounts[val] || 0) + 1;
                }
            });

            colInputs.forEach(inp => {
                const valStr = inp.value.trim();
                if (valStr === "") {
                    inp.classList.remove('input-invalid');
                    inp.title = `Columna ${columnRanges[inp.dataset.col].name} (${inp.dataset.min}-${inp.dataset.max})`;
                    return;
                }

                const val = parseInt(valStr, 10);
                const min = parseInt(inp.dataset.min, 10);
                const max = parseInt(inp.dataset.max, 10);
                const colName = columnRanges[inp.dataset.col].name;

                let errorMessage = "";

                if (isNaN(val) || val < min || val > max) {
                    errorMessage = `Número fuera de rango para la columna ${colName} (${min}-${max})`;
                } else if (valueCounts[valStr] > 1) {
                    errorMessage = `Número ${val} duplicado en la columna ${colName}`;
                }

                if (errorMessage !== "") {
                    inp.classList.add('input-invalid');
                    inp.title = errorMessage;
                } else {
                    inp.classList.remove('input-invalid');
                    inp.title = `Columna ${colName} (${min}-${max})`;
                }
            });
        }

        function addNewSheet() { 
            sheetsData.push(createEmptySheet(sheetsData.length + 1)); 
            renderModalSheets(); 
        }

        function removeSheet(sIdx) { 
            if (sheetsData.length > 1) { 
                sheetsData.splice(sIdx, 1); 
                renderModalSheets(); 
            } else {
                alert("Debe existir al menos una hoja.");
            }
        }

        function clearSingleSheet(sIdx) {
            if (confirm(`¿Vaciar los números de la Hoja ${sIdx + 1}?`)) {
                sheetsData[sIdx] = createEmptySheet(sheetsData[sIdx].title || (sIdx + 1));
                renderModalSheets();
            }
        }

        function autoFillRandom() {
            for (let s = 0; s < sheetsData.length; s++) {
                for (let c = 0; c < 4; c++) {
                    for (let col = 0; col < 5; col++) {
                        const { min, max } = columnRanges[col];
                        const nums = [];
                        while (nums.length < 5) {
                            const r = Math.floor(Math.random() * (max - min + 1)) + min;
                            if (!nums.includes(r)) nums.push(r);
                        }
                        for (let row = 0; row < 5; row++) {
                            const idx = row * 5 + col;
                            if (idx !== 12) {
                                const input = document.querySelector(`input[data-sheet="${s}"][data-card="${c}"][data-cell="${idx}"]`);
                                if (input) {
                                    input.value = nums[row];
                                    validateCardInput(input);
                                }
                            }
                        }
                    }
                }
            }
        }

        function triggerSheetTxtUpload(sIdx) {
            currentUploadSheetIndex = sIdx;
            const fileInput = document.getElementById('sheetTxtFileInput');
            fileInput.value = '';
            fileInput.click();
        }

        function handleSheetTxtUpload(input) {
            const file = input.files[0];
            if (!file || currentUploadSheetIndex === null) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                processSingleSheetTxt(content, currentUploadSheetIndex);
            };
            reader.readAsText(file);
        }

        function processSingleSheetTxt(text, sIdx) {
            const lines = text.split('\n')
                              .map(line => line.trim())
                              .filter(line => line.length > 0 && !line.startsWith('[') && !line.toLowerCase().startsWith('hoja'));

            if (lines.length < 4) {
                alert("El archivo TXT debe contener al menos 4 líneas (una para cada cartón de esta hoja).");
                return;
            }

            for (let c = 0; c < 4; c++) {
                const numbers = lines[c].split(/[\s,]+/).filter(n => n.length > 0);
                if (numbers.length >= 24) {
                    let numIdx = 0;
                    for (let i = 0; i < 25; i++) {
                        if (i === 12) continue;
                        if (numIdx < numbers.length) {
                            if (numbers.length === 25 && numIdx === 12 && isNaN(parseInt(numbers[numIdx], 10))) {
                                numIdx++;
                            }
                            if (numIdx < numbers.length) {
                                const val = parseInt(numbers[numIdx], 10);
                                const input = document.querySelector(`input[data-sheet="${sIdx}"][data-card="${c}"][data-cell="${i}"]`);
                                if (input) {
                                    input.value = isNaN(val) ? "" : String(val).slice(0, 2);
                                    validateCardInput(input);
                                }
                                numIdx++;
                            }
                        }
                    }
                }
            }
            alert(`¡Se han cargado los 4 cartones en la Hoja ${sIdx + 1}!`);
        }

        function saveModalChanges() {
            const invalidInputs = document.querySelectorAll('#modalSheetsWrapper input.input-invalid');
            if (invalidInputs.length > 0) {
                alert("Por favor corrije los números duplicados o fuera de rango antes de guardar.");
                invalidInputs[0].focus();
                return;
            }

            for (let s = 0; s < sheetsData.length; s++) {
                const titleInput = document.getElementById(`sheetNum${s}`);
                if (titleInput) {
                    sheetsData[s].title = titleInput.value.trim() || `Hoja ${s + 1}`;
                }

                for (let c = 0; c < 4; c++) {
                    for (let i = 0; i < 25; i++) {
                        if (i !== 12) {
                            const input = document.querySelector(`input[data-sheet="${s}"][data-card="${c}"][data-cell="${i}"]`);
                            if (input) {
                                const valStr = input.value.trim();
                                sheetsData[s].cards[c][i] = valStr !== "" ? parseInt(valStr, 10) : "";
                            }
                        } else {
                            sheetsData[s].cards[c][12] = ".es";
                        }
                    }
                }
            }
            closeFillModal();
            renderGame();
        }

        function saveCurrentSlot() {
            const name = prompt("Nombre de la partida:");
            if (!name) return;

            const savedData = JSON.parse(localStorage.getItem('bingo_saved_slots') || '{}');
            savedData[name.trim()] = { sheetsData, markedHistory, allPatterns };
            localStorage.setItem('bingo_saved_slots', JSON.stringify(savedData));
            updateSavedSlotsDropdown();
        }

        function updateSavedSlotsDropdown() {
            const select = document.getElementById('savedSlotsSelect');
            if(!select) return;
            select.innerHTML = '<option value="">-- Partidas Guardadas --</option>';
            const savedData = JSON.parse(localStorage.getItem('bingo_saved_slots') || '{}');
            for (let name in savedData) {
                const opt = document.createElement('option');
                opt.value = name; opt.textContent = name;
                select.appendChild(opt);
            }
        }

        function loadSelectedSlot() {
            const select = document.getElementById('savedSlotsSelect');
            if(!select) return;
            const name = select.value;
            if (!name) return;
            const savedData = JSON.parse(localStorage.getItem('bingo_saved_slots') || '{}');
            if (savedData[name]) {
                sheetsData = savedData[name].sheetsData;
                markedHistory = savedData[name].markedHistory || [];
                if (savedData[name].allPatterns) {
                    allPatterns = savedData[name].allPatterns;
                    refreshVersionSelectOptions();
                }
                renderGame(); 
                renderHistory();
            }
        }

        function deleteSelectedSlot() {
            const select = document.getElementById('savedSlotsSelect');
            if(!select) return;
            const slotName = select.value;
            if (!slotName) return;
            if(!confirm(`¿Eliminar la partida "${slotName}"?`)) return;
            const savedData = JSON.parse(localStorage.getItem('bingo_saved_slots') || '{}');
            delete savedData[slotName];
            localStorage.setItem('bingo_saved_slots', JSON.stringify(savedData));
            updateSavedSlotsDropdown();
        }

        function exportGameData() {
            const exportObj = { sheetsData, markedHistory, allPatterns };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObj, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `bingo_backup_${Date.now()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importGameData(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedObj = JSON.parse(e.target.result);
                    if (importedObj.sheetsData) sheetsData = importedObj.sheetsData;
                    if (importedObj.markedHistory) markedHistory = importedObj.markedHistory;
                    if (importedObj.allPatterns) {
                        allPatterns = importedObj.allPatterns;
                        refreshVersionSelectOptions();
                    }
                    renderGame();
                    renderHistory();
                    alert("¡Configuración cargada con éxito!");
                } catch (err) {
                    alert("Error al leer el archivo JSON: " + err.message);
                }
            };
            reader.readAsText(file);
        }

        window.onload = function() {
            refreshVersionSelectOptions();
            changeVersionGroup();
            renderGame();
            updateSavedSlotsDropdown();
            lucide.createIcons();
        };
    </script>
</body>
</html>
